<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Burger Lab - Brag Video</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
    }

    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      overflow: hidden;
    }

    .scene__bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transform-origin: center;
    }

    .scene__scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(10, 10, 10, 0.75) 0%,
        rgba(10, 10, 10, 0.4) 50%,
        rgba(10, 10, 10, 0.6) 100%
      );
    }

    .scene__content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 120px;
    }

    .hook-title {
      font-family: 'Space Mono', monospace;
      font-size: 72px;
      font-weight: 700;
      color: #39FF14;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 0 40px rgba(57, 255, 20, 0.4);
      opacity: 0;
    }

    .hook-sub {
      font-size: 36px;
      font-weight: 400;
      color: #fff;
      margin-top: 16px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.9);
      opacity: 0;
    }

    .browser-frame {
      position: absolute;
      top: 50px;
      left: 100px;
      right: 100px;
      bottom: 50px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(57, 255, 20, 0.1);
      border: 1px solid rgba(57, 255, 20, 0.2);
      opacity: 0;
    }

    .browser-frame__bar {
      height: 40px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
    }

    .browser-frame__dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff5f57;
    }
    .browser-frame__dot:nth-child(2) { background: #ffbd2e; }
    .browser-frame__dot:nth-child(3) { background: #28c940; }

    .browser-frame__url {
      flex: 1;
      margin-left: 20px;
      height: 24px;
      background: #0a0a0a;
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: #39FF14;
    }

    .browser-frame__content {
      position: relative;
      height: calc(100% - 40px);
      overflow: hidden;
    }

    .browser-frame__scroll {
      position: absolute;
      width: 100%;
      background-size: 100% auto;
      background-repeat: no-repeat;
      background-position: top center;
    }

    .cta-overlay {
      position: absolute;
      bottom: 100px;
      left: 0;
      right: 0;
      text-align: center;
      opacity: 0;
    }

    .cta-title {
      font-family: 'Space Mono', monospace;
      font-size: 64px;
      font-weight: 700;
      color: #39FF14;
      text-transform: uppercase;
      text-shadow: 0 0 40px rgba(57, 255, 20, 0.5);
      margin-bottom: 16px;
    }

    .cta-sub {
      font-size: 24px;
      color: #fff;
      text-shadow: 0 2px 20px rgba(0,0,0,0.9);
    }

    .logo-outro {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
    }

    .logo-outro__mark {
      font-family: 'Space Mono', monospace;
      font-size: 100px;
      font-weight: 700;
      color: #39FF14;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-shadow: 0 0 60px rgba(57, 255, 20, 0.5);
    }

    .logo-outro__tag {
      font-size: 28px;
      color: #fff;
      margin-top: 20px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="burger-brag"
    data-start="0"
    data-duration="20"
    data-width="1920"
    data-height="1080"
  >
    <!-- Scene 1: Hook on hero (0-4s) -->
    <div class="scene clip" id="scene-1" data-start="0" data-duration="4" data-track-index="0">
      <div class="scene__bg" id="scene-1-bg" style="background-image: url('assets/captures/viewport-0.png');"></div>
      <div class="scene__scrim"></div>
      <div class="scene__content">
        <h1 class="hook-title" id="hook-title">We Don't Cook.</h1>
        <p class="hook-sub" id="hook-sub">We Experiment.</p>
      </div>
    </div>

    <!-- Scene 2: Browser showing homepage scroll (4-11s) -->
    <div class="scene clip" id="scene-2" data-start="4" data-duration="7" data-track-index="1">
      <div class="scene__bg" style="background: #0a0a0a;"></div>
      <div class="browser-frame" id="browser">
        <div class="browser-frame__bar">
          <span class="browser-frame__dot"></span>
          <span class="browser-frame__dot"></span>
          <span class="browser-frame__dot"></span>
          <div class="browser-frame__url">burgerlabbar.com</div>
        </div>
        <div class="browser-frame__content">
          <div class="browser-frame__scroll" id="browser-scroll" style="background-image: url('assets/captures/fullpage.png');"></div>
        </div>
      </div>
    </div>

    <!-- Scene 3: Menu section with CTA (11-16s) -->
    <div class="scene clip" id="scene-3" data-start="11" data-duration="5" data-track-index="2">
      <div class="scene__bg" id="scene-3-bg" style="background-image: url('assets/captures/viewport-1.png');"></div>
      <div class="scene__scrim"></div>
      <div class="cta-overlay" id="cta">
        <div class="cta-title">Reserve the Experiment</div>
        <div class="cta-sub">Salt Lake City's Gourmet Burger Laboratory</div>
      </div>
    </div>

    <!-- Scene 4: Logo outro (16-20s) -->
    <div class="scene clip" id="scene-4" data-start="16" data-duration="4" data-track-index="3">
      <div class="scene__bg" id="scene-4-bg" style="background-image: url('assets/captures/viewport-2.png'); filter: brightness(0.5);"></div>
      <div class="scene__scrim" style="background: rgba(10,10,10,0.7);"></div>
      <div class="logo-outro" id="outro">
        <div class="logo-outro__mark">BURGER.LAB</div>
        <div class="logo-outro__tag">Gourmet Burgers & Cocktail Lab</div>
      </div>
    </div>

    <!-- Audio -->
    <audio id="bg-music" data-start="0" data-duration="20" data-track-index="10" data-volume="0.25" src="assets/music/happy-beats-business-moves-vol-10-by-ende-dot-app.mp3"></audio>
    <audio id="sfx-click" data-start="2" data-duration="1" data-track-index="11" data-volume="0.35" src="assets/sfx/interface/click_001.ogg"></audio>
    <audio id="sfx-impact" data-start="11.5" data-duration="1" data-track-index="12" data-volume="0.4" src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Scene 1: Hook (0-4s)
    tl.to("#scene-1", { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#scene-1-bg", { scale: 1.1 }, { scale: 1.0, duration: 4, ease: "power1.out" }, 0);
    tl.fromTo("#hook-title", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.8, ease: "power2.out" }, 0.5);
    tl.fromTo("#hook-sub", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.3);
    tl.to("#scene-1", { opacity: 0, duration: 0.5 }, 3.5);

    // Scene 2: Browser scroll (4-11s)
    tl.to("#scene-2", { opacity: 1, duration: 0.3 }, 4);
    tl.fromTo("#browser", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 4.2);
    
    // Calculate scroll for fullpage
    tl.set("#browser-scroll", { height: "5200px", y: 0 }, 4);
    tl.to("#browser-scroll", { y: -3500, duration: 6, ease: "power1.inOut" }, 4.5);
    tl.to("#scene-2", { opacity: 0, duration: 0.4 }, 10.6);

    // Scene 3: CTA (11-16s)
    tl.to("#scene-3", { opacity: 1, duration: 0.3 }, 11);
    tl.fromTo("#scene-3-bg", { scale: 1.08, x: 30 }, { scale: 1.0, x: 0, duration: 5, ease: "power1.out" }, 11);
    tl.fromTo("#cta", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 11.5);
    tl.to("#scene-3", { opacity: 0, duration: 0.4 }, 15.6);

    // Scene 4: Outro (16-20s)
    tl.to("#scene-4", { opacity: 1, duration: 0.3 }, 16);
    tl.fromTo("#scene-4-bg", { scale: 1.1 }, { scale: 1.0, duration: 4, ease: "power1.out" }, 16);
    tl.fromTo("#outro", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.1)" }, 16.5);
    tl.to("#scene-4", { opacity: 0, duration: 0.5 }, 19.5);

    window.__timelines = window.__timelines || {};
    window.__timelines["burger-brag"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
