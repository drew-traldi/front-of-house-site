<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Dasks - Brag Video</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #f5f1eb;
      font-family: 'Playfair Display', Georgia, serif;
      color: #1a3a5c;
    }

    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      overflow: hidden;
    }

    .scene__bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transform-origin: center;
    }

    .scene__scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(26, 58, 92, 0.5) 0%, rgba(26, 58, 92, 0.15) 50%, rgba(26, 58, 92, 0.35) 100%);
    }

    .browser-frame {
      position: absolute;
      top: 50px;
      left: 100px;
      right: 100px;
      bottom: 50px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(26, 58, 92, 0.3);
      border: 1px solid rgba(26, 58, 92, 0.2);
      opacity: 0;
    }

    .browser-frame__bar {
      height: 40px;
      background: #1a3a5c;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
    }

    .browser-frame__dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff5f57;
    }
    .browser-frame__dot:nth-child(2) { background: #ffbd2e; }
    .browser-frame__dot:nth-child(3) { background: #28c940; }

    .browser-frame__url {
      flex: 1;
      margin-left: 20px;
      height: 24px;
      background: #0d2540;
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: #aab8c8;
    }

    .browser-frame__content {
      position: relative;
      height: calc(100% - 40px);
      overflow: hidden;
      background: #f5f1eb;
    }

    .browser-frame__scroll {
      position: absolute;
      width: 100%;
      background-size: 100% auto;
      background-repeat: no-repeat;
      background-position: top center;
    }

    .logo-outro {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
    }

    .logo-outro__mark {
      font-size: 120px;
      font-weight: 700;
      color: #1a3a5c;
      letter-spacing: 0.1em;
      text-shadow: 0 4px 40px rgba(255,255,255,0.6);
    }

    .logo-outro__tag {
      font-family: 'Inter', sans-serif;
      font-size: 28px;
      color: #8b4513;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="dasks-brag"
    data-start="0"
    data-duration="16"
    data-width="1920"
    data-height="1080"
  >
    <!-- Scene 1: Hero - site's own headline (0-4.3s) -->
    <div class="scene clip" id="scene-1" data-start="0" data-duration="4.5" data-track-index="0">
      <div class="scene__bg" id="scene-1-bg" style="background-image: url('assets/captures/viewport-0.png');"></div>
    </div>

    <!-- Scene 2: Site scroll without browser frame (4-10.3s) -->
    <div class="scene clip" id="scene-2" data-start="4" data-duration="6.5" data-track-index="1">
      <div class="scene__bg" id="scene-2-bg" style="background-image: url('assets/captures/viewport-1.png');"></div>
      <div style="position: absolute; inset: 0; overflow: hidden;">
        <div id="site-scroll" style="position: absolute; width: 100%; height: 1400px; background-image: url('assets/captures/fullpage.png'); background-size: 100% auto; background-repeat: no-repeat; background-position: top center;"></div>
      </div>
    </div>

    <!-- Scene 3: Food section (10-12.3s) -->
    <div class="scene clip" id="scene-3" data-start="10" data-duration="2.5" data-track-index="2">
      <div class="scene__bg" id="scene-3-bg" style="background-image: url('assets/captures/viewport-2.png');"></div>
    </div>

    <!-- Scene 4: Logo outro on food image (12-16s) -->
    <div class="scene clip" id="scene-4" data-start="12" data-duration="4" data-track-index="3">
      <div class="scene__bg" id="scene-4-bg" style="background-image: url('assets/captures/viewport-2.png'); filter: brightness(0.7);"></div>
      <div class="scene__scrim" style="background: linear-gradient(135deg, rgba(26,58,92,0.75) 0%, rgba(26,58,92,0.5) 50%, rgba(26,58,92,0.65) 100%);"></div>
      <div class="logo-outro" id="outro">
        <div class="logo-outro__mark" style="color: #fff;">DASKS</div>
        <div class="logo-outro__tag" style="color: #f5f1eb;">Authentic Greek Cuisine in Salt Lake City</div>
      </div>
    </div>

    <!-- Audio -->
    <audio id="bg-music" data-start="0" data-duration="16" data-track-index="10" data-volume="0.25" src="assets/music/happy-beats-business-moves-vol-11-by-ende-dot-app.mp3"></audio>
    <audio id="sfx-bell" data-start="2" data-duration="2" data-track-index="11" data-volume="0.35" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
    <audio id="sfx-drop" data-start="10.3" data-duration="1" data-track-index="12" data-volume="0.35" src="assets/sfx/interface/drop_002.ogg"></audio>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Scene 1: Hero (0-4.3s)
    tl.to("#scene-1", { opacity: 1, duration: 0.2 }, 0);
    tl.fromTo("#scene-1-bg", { scale: 1.06 }, { scale: 1.0, duration: 4.3, ease: "power1.out" }, 0);
    tl.to("#scene-1", { opacity: 0, duration: 0.3 }, 4);

    // Scene 2: Site scroll (4-10.3s)
    tl.to("#scene-2", { opacity: 1, duration: 0.3 }, 4);
    tl.set("#site-scroll", { y: 0 }, 4);
    tl.to("#site-scroll", { y: -400, duration: 5.5, ease: "power1.inOut" }, 4.5);
    tl.to("#scene-2", { opacity: 0, duration: 0.3 }, 10);

    // Scene 3: Food (10-12.3s)
    tl.to("#scene-3", { opacity: 1, duration: 0.3 }, 10);
    tl.fromTo("#scene-3-bg", { scale: 1.06, x: 25 }, { scale: 1.0, x: 0, duration: 2.3, ease: "power1.out" }, 10);
    tl.to("#scene-3", { opacity: 0, duration: 0.3 }, 12);

    // Scene 4: Outro (12-16s)
    tl.to("#scene-4", { opacity: 1, duration: 0.3 }, 12);
    tl.fromTo("#scene-4-bg", { scale: 1.04 }, { scale: 1.0, duration: 4, ease: "power1.out" }, 12);
    tl.fromTo("#outro", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.1)" }, 12.4);
    tl.to("#scene-4", { opacity: 0, duration: 0.3 }, 15.7);

    window.__timelines = window.__timelines || {};
    window.__timelines["dasks-brag"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
