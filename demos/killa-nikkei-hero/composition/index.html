<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Killa Nikkei - Hero Ambient Loop</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0a0a0a;
    }

    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      overflow: hidden;
    }

    .scene__bg {
      position: absolute;
      inset: -80px;
      background-size: cover;
      background-position: center;
      transform-origin: center;
    }

    .scene__vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 85% 75% at 50% 50%, transparent 0%, rgba(10, 10, 10, 0.25) 100%);
    }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="killa-hero"
    data-start="0"
    data-duration="12"
    data-width="1920"
    data-height="1080"
  >
    <!-- Scene 1: Patio with Ken Burns (0-4s) -->
    <div class="scene clip" id="scene-1" data-start="0" data-duration="4.3" data-track-index="0">
      <div class="scene__bg" id="scene-1-bg" style="background-image: url('assets/captures/patio.png');"></div>
      <div class="scene__vignette"></div>
    </div>

    <!-- Scene 2: Ceviche dish (3.8-7s) -->
    <div class="scene clip" id="scene-2" data-start="3.8" data-duration="3.5" data-track-index="1">
      <div class="scene__bg" id="scene-2-bg" style="background-image: url('assets/captures/ceviche.jpg');"></div>
      <div class="scene__vignette"></div>
    </div>

    <!-- Scene 3: Old Fashioned (6.8-9.5s) -->
    <div class="scene clip" id="scene-3" data-start="6.8" data-duration="3" data-track-index="2">
      <div class="scene__bg" id="scene-3-bg" style="background-image: url('assets/captures/old-fashioned.jpg');"></div>
      <div class="scene__vignette"></div>
    </div>

    <!-- Scene 4: Back to patio for loop (9.2-12s) -->
    <div class="scene clip" id="scene-4" data-start="9.2" data-duration="2.8" data-track-index="3">
      <div class="scene__bg" id="scene-4-bg" style="background-image: url('assets/captures/patio.png');"></div>
      <div class="scene__vignette"></div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Scene 1: Patio slow zoom out (0-4.3s)
    tl.to("#scene-1", { opacity: 1, duration: 0.3 }, 0);
    tl.fromTo("#scene-1-bg", { scale: 1.12, x: 25 }, { scale: 1.02, x: -15, duration: 4.3, ease: "power1.inOut" }, 0);
    tl.to("#scene-1", { opacity: 0, duration: 0.3 }, 4);

    // Scene 2: Ceviche (3.8-7s) - cross-fade
    tl.to("#scene-2", { opacity: 1, duration: 0.3 }, 3.8);
    tl.fromTo("#scene-2-bg", { scale: 1.15, x: -20 }, { scale: 1.05, x: 10, duration: 3.2, ease: "power1.inOut" }, 3.8);
    tl.to("#scene-2", { opacity: 0, duration: 0.3 }, 6.7);

    // Scene 3: Old Fashioned (6.8-9.5s) - cross-fade
    tl.to("#scene-3", { opacity: 1, duration: 0.3 }, 6.8);
    tl.fromTo("#scene-3-bg", { scale: 1.18, y: 15 }, { scale: 1.06, y: -10, duration: 2.7, ease: "power1.inOut" }, 6.8);
    tl.to("#scene-3", { opacity: 0, duration: 0.3 }, 9.2);

    // Scene 4: Patio for loop return (9.2-12s) - matches Scene 1 start
    tl.to("#scene-4", { opacity: 1, duration: 0.3 }, 9.2);
    tl.fromTo("#scene-4-bg", { scale: 1.02, x: -15 }, { scale: 1.12, x: 25, duration: 2.8, ease: "power1.inOut" }, 9.2);
    tl.to("#scene-4", { opacity: 0, duration: 0.2 }, 11.8);

    window.__timelines = window.__timelines || {};
    window.__timelines["killa-hero"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
