<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Killa Nikkei - Hero Ambient Loop</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0a0a0a;
    }

    .ambient-layer {
      position: absolute;
      inset: 0;
    }

    .gradient-base {
      background: radial-gradient(ellipse 120% 80% at 70% 50%, 
        rgba(26, 21, 16, 0.9) 0%, 
        rgba(10, 10, 10, 1) 60%);
    }

    .golden-glow {
      background: radial-gradient(ellipse 80% 60% at 65% 45%, 
        rgba(212, 175, 55, 0.08) 0%, 
        transparent 50%);
      opacity: 0;
    }

    .accent-orb-1 {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, transparent 70%);
      top: 20%;
      right: 15%;
      filter: blur(80px);
      opacity: 0;
    }

    .accent-orb-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
      bottom: 25%;
      right: 30%;
      filter: blur(60px);
      opacity: 0;
    }

    .accent-orb-3 {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200, 160, 50, 0.08) 0%, transparent 70%);
      top: 40%;
      right: 45%;
      filter: blur(50px);
      opacity: 0;
    }

    .shimmer-line {
      position: absolute;
      width: 2px;
      height: 200px;
      background: linear-gradient(to bottom, transparent, rgba(212, 175, 55, 0.3), transparent);
      opacity: 0;
    }

    .shimmer-1 { right: 25%; top: 30%; }
    .shimmer-2 { right: 40%; top: 45%; height: 150px; }
    .shimmer-3 { right: 55%; top: 35%; height: 180px; }

    .subtle-particles {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(1px 1px at 70% 20%, rgba(212, 175, 55, 0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 75% 40%, rgba(212, 175, 55, 0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 65% 60%, rgba(212, 175, 55, 0.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 70%, rgba(212, 175, 55, 0.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 80%, rgba(212, 175, 55, 0.3) 0%, transparent 100%);
      opacity: 0;
    }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="killa-hero"
    data-start="0"
    data-duration="12"
    data-width="1920"
    data-height="1080"
  >
    <div class="ambient-layer gradient-base clip" id="base" data-start="0" data-duration="12" data-track-index="0"></div>
    <div class="ambient-layer golden-glow clip" id="glow" data-start="0" data-duration="12" data-track-index="1"></div>
    <div class="accent-orb-1 clip" id="orb1" data-start="0" data-duration="12" data-track-index="2"></div>
    <div class="accent-orb-2 clip" id="orb2" data-start="0" data-duration="12" data-track-index="3"></div>
    <div class="accent-orb-3 clip" id="orb3" data-start="0" data-duration="12" data-track-index="4"></div>
    <div class="shimmer-line shimmer-1 clip" id="shimmer1" data-start="0" data-duration="12" data-track-index="5"></div>
    <div class="shimmer-line shimmer-2 clip" id="shimmer2" data-start="0" data-duration="12" data-track-index="6"></div>
    <div class="shimmer-line shimmer-3 clip" id="shimmer3" data-start="0" data-duration="12" data-track-index="7"></div>
    <div class="subtle-particles clip" id="particles" data-start="0" data-duration="12" data-track-index="8"></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    tl.to("#glow", { opacity: 0.8, duration: 3, ease: "power1.inOut" }, 0);
    tl.to("#glow", { opacity: 0.5, duration: 3, ease: "power1.inOut" }, 6);
    tl.to("#glow", { opacity: 0.8, duration: 3, ease: "power1.inOut" }, 9);

    tl.to("#orb1", { opacity: 0.7, duration: 2, ease: "power2.out" }, 0);
    tl.to("#orb1", { x: 30, y: -20, duration: 6, ease: "sine.inOut" }, 0);
    tl.to("#orb1", { x: 0, y: 0, duration: 6, ease: "sine.inOut" }, 6);

    tl.to("#orb2", { opacity: 0.6, duration: 2.5, ease: "power2.out" }, 0.5);
    tl.to("#orb2", { x: -40, y: 25, duration: 5.5, ease: "sine.inOut" }, 0.5);
    tl.to("#orb2", { x: 0, y: 0, duration: 5.5, ease: "sine.inOut" }, 6);

    tl.to("#orb3", { opacity: 0.5, duration: 3, ease: "power2.out" }, 1);
    tl.to("#orb3", { x: 20, y: -15, duration: 5, ease: "sine.inOut" }, 1);
    tl.to("#orb3", { x: 0, y: 0, duration: 5, ease: "sine.inOut" }, 7);

    tl.to("#shimmer1", { opacity: 0.6, y: 100, duration: 3, ease: "power1.inOut" }, 1);
    tl.to("#shimmer1", { opacity: 0, y: 200, duration: 2, ease: "power1.in" }, 4);
    tl.set("#shimmer1", { y: 0 }, 6);
    tl.to("#shimmer1", { opacity: 0.5, y: 80, duration: 3, ease: "power1.inOut" }, 7);
    tl.to("#shimmer1", { opacity: 0, y: 160, duration: 2, ease: "power1.in" }, 10);

    tl.to("#shimmer2", { opacity: 0.4, y: 60, duration: 2.5, ease: "power1.inOut" }, 2);
    tl.to("#shimmer2", { opacity: 0, y: 120, duration: 2, ease: "power1.in" }, 5);
    tl.set("#shimmer2", { y: 0 }, 7);
    tl.to("#shimmer2", { opacity: 0.35, y: 50, duration: 2.5, ease: "power1.inOut" }, 8);
    tl.to("#shimmer2", { opacity: 0, y: 100, duration: 1.5, ease: "power1.in" }, 10.5);

    tl.to("#shimmer3", { opacity: 0.3, y: 70, duration: 3, ease: "power1.inOut" }, 0.5);
    tl.to("#shimmer3", { opacity: 0, y: 140, duration: 2, ease: "power1.in" }, 4);
    tl.set("#shimmer3", { y: 0 }, 6.5);
    tl.to("#shimmer3", { opacity: 0.25, y: 60, duration: 3, ease: "power1.inOut" }, 7.5);
    tl.to("#shimmer3", { opacity: 0, y: 120, duration: 1.5, ease: "power1.in" }, 11);

    tl.to("#particles", { opacity: 0.7, duration: 2, ease: "power2.out" }, 0);
    tl.to("#particles", { opacity: 0.4, duration: 3, ease: "sine.inOut" }, 4);
    tl.to("#particles", { opacity: 0.65, duration: 3, ease: "sine.inOut" }, 8);

    window.__timelines = window.__timelines || {};
    window.__timelines["killa-hero"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
