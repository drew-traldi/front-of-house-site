<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Killa Nikkei - Brag Video</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Cormorant', Georgia, serif;
      color: #ffffff;
    }

    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      overflow: hidden;
    }

    .scene__bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transform-origin: center;
    }

    .scene__scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(10, 10, 10, 0.7) 0%,
        rgba(10, 10, 10, 0.3) 50%,
        rgba(10, 10, 10, 0.5) 100%
      );
    }

    .scene__content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 120px;
    }

    .hook-title {
      font-size: 96px;
      font-weight: 600;
      color: #D4AF37;
      letter-spacing: 0.06em;
      text-shadow: 0 4px 40px rgba(0,0,0,0.8);
      opacity: 0;
    }

    .hook-sub {
      font-size: 48px;
      font-weight: 400;
      color: #fff;
      font-style: italic;
      margin-top: 20px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.9);
      opacity: 0;
    }

    .browser-frame {
      position: absolute;
      top: 60px;
      left: 120px;
      right: 120px;
      bottom: 60px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      opacity: 0;
    }

    .browser-frame__bar {
      height: 40px;
      background: #2a2a2a;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
    }

    .browser-frame__dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff5f57;
    }
    .browser-frame__dot:nth-child(2) { background: #ffbd2e; }
    .browser-frame__dot:nth-child(3) { background: #28c940; }

    .browser-frame__url {
      flex: 1;
      margin-left: 20px;
      height: 24px;
      background: #1a1a1a;
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: #888;
    }

    .browser-frame__content {
      position: relative;
      height: calc(100% - 40px);
      overflow: hidden;
    }

    .browser-frame__scroll {
      position: absolute;
      width: 100%;
      background-size: 100% auto;
      background-repeat: no-repeat;
      background-position: top center;
    }

    .dish-grid {
      position: absolute;
      bottom: 100px;
      left: 120px;
      right: 120px;
      display: flex;
      gap: 40px;
      justify-content: center;
    }

    .dish-card {
      width: 380px;
      background: rgba(10, 10, 10, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 16px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(40px);
    }

    .dish-card__img {
      width: 100%;
      height: 240px;
      background-size: cover;
      background-position: center;
    }

    .dish-card__text {
      padding: 24px;
      text-align: center;
    }

    .dish-card__name {
      font-size: 28px;
      font-weight: 600;
      color: #D4AF37;
      margin-bottom: 8px;
    }

    .dish-card__desc {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #aaa;
      line-height: 1.5;
    }

    .cta-overlay {
      position: absolute;
      bottom: 80px;
      left: 0;
      right: 0;
      text-align: center;
      opacity: 0;
    }

    .cta-title {
      font-size: 72px;
      font-weight: 600;
      color: #D4AF37;
      text-shadow: 0 4px 40px rgba(0,0,0,0.9);
      margin-bottom: 16px;
    }

    .cta-sub {
      font-family: 'Inter', sans-serif;
      font-size: 24px;
      color: #fff;
      text-shadow: 0 2px 20px rgba(0,0,0,0.9);
    }

    .logo-outro {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
    }

    .logo-outro__mark {
      font-size: 140px;
      font-weight: 700;
      color: #D4AF37;
      letter-spacing: 0.2em;
      text-shadow: 0 4px 60px rgba(212, 175, 55, 0.4);
    }

    .logo-outro__tag {
      font-size: 32px;
      font-style: italic;
      color: #fff;
      margin-top: 20px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="killa-brag"
    data-start="0"
    data-duration="22"
    data-width="1920"
    data-height="1080"
  >
    <!-- Scene 1: Hook on patio hero (0-4s) -->
    <div class="scene clip" id="scene-1" data-start="0" data-duration="4" data-track-index="0">
      <div class="scene__bg" id="scene-1-bg" style="background-image: url('assets/captures/patio.png');"></div>
      <div class="scene__scrim"></div>
      <div class="scene__content">
        <h1 class="hook-title" id="hook-title">A Flavor Ritual</h1>
        <p class="hook-sub" id="hook-sub">made Under the Moon.</p>
      </div>
    </div>

    <!-- Scene 2: Browser showing homepage scroll (4-10s) -->
    <div class="scene clip" id="scene-2" data-start="4" data-duration="6" data-track-index="1">
      <div class="scene__bg" style="background: #0a0a0a;"></div>
      <div class="browser-frame" id="browser">
        <div class="browser-frame__bar">
          <span class="browser-frame__dot"></span>
          <span class="browser-frame__dot"></span>
          <span class="browser-frame__dot"></span>
          <div class="browser-frame__url">killanikkei.com</div>
        </div>
        <div class="browser-frame__content">
          <div class="browser-frame__scroll" id="browser-scroll" style="background-image: url('assets/captures/fullpage.png');"></div>
        </div>
      </div>
    </div>

    <!-- Scene 3: Dish showcase on food photo bg (10-16s) -->
    <div class="scene clip" id="scene-3" data-start="10" data-duration="6" data-track-index="2">
      <div class="scene__bg" id="scene-3-bg" style="background-image: url('assets/captures/viewport-1.png');"></div>
      <div class="scene__scrim" style="background: rgba(10,10,10,0.75);"></div>
      <div class="dish-grid">
        <div class="dish-card" id="dish-1">
          <div class="dish-card__img" style="background-image: url('assets/captures/ceviche.jpg');"></div>
          <div class="dish-card__text">
            <div class="dish-card__name">Ceviche Killa</div>
            <div class="dish-card__desc">Tuna, Cucumber, Cherry Daikon, Aji Limo</div>
          </div>
        </div>
        <div class="dish-card" id="dish-2">
          <div class="dish-card__img" style="background-image: url('assets/captures/old-fashioned.jpg');"></div>
          <div class="dish-card__text">
            <div class="dish-card__name">Killa Old Fashioned</div>
            <div class="dish-card__desc">Andean Black Whisky, Kuromitsu, Cacao</div>
          </div>
        </div>
        <div class="dish-card" id="dish-3">
          <div class="dish-card__img" style="background-image: url('assets/captures/causa.jpg');"></div>
          <div class="dish-card__text">
            <div class="dish-card__name">Crab Causa</div>
            <div class="dish-card__desc">Black Potato Mousse, Avocado, Huancaina</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scene 4: Reserve CTA on viewport (16-19s) -->
    <div class="scene clip" id="scene-4" data-start="16" data-duration="3" data-track-index="3">
      <div class="scene__bg" id="scene-4-bg" style="background-image: url('assets/captures/viewport-3.png');"></div>
      <div class="scene__scrim"></div>
      <div class="cta-overlay" id="cta">
        <div class="cta-title">Reserve Your Table</div>
        <div class="cta-sub">279 E 300 S, Salt Lake City</div>
      </div>
    </div>

    <!-- Scene 5: Logo outro on patio (19-22s) -->
    <div class="scene clip" id="scene-5" data-start="19" data-duration="3" data-track-index="4">
      <div class="scene__bg" id="scene-5-bg" style="background-image: url('assets/captures/patio.png'); filter: brightness(0.6);"></div>
      <div class="scene__scrim" style="background: rgba(10,10,10,0.6);"></div>
      <div class="logo-outro" id="outro">
        <div class="logo-outro__mark">KILLA</div>
        <div class="logo-outro__tag">Two Worlds, One Moon.</div>
      </div>
    </div>

    <!-- Audio -->
    <audio id="bg-music" data-start="0" data-duration="22" data-track-index="10" data-volume="0.25" src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"></audio>
    <audio id="sfx-bell" data-start="2.5" data-duration="2" data-track-index="11" data-volume="0.4" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
    <audio id="sfx-drop" data-start="11" data-duration="1" data-track-index="12" data-volume="0.35" src="assets/sfx/interface/drop_001.ogg"></audio>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Scene 1: Hook on patio (0-4s)
    tl.to("#scene-1", { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#scene-1-bg", { scale: 1.1 }, { scale: 1.0, duration: 4, ease: "power1.out" }, 0);
    tl.fromTo("#hook-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1, ease: "power2.out" }, 0.5);
    tl.fromTo("#hook-sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 1.5);
    tl.to("#scene-1", { opacity: 0, duration: 0.5 }, 3.5);

    // Scene 2: Browser scroll (4-10s)
    tl.to("#scene-2", { opacity: 1, duration: 0.3 }, 4);
    tl.fromTo("#browser", { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 4.2);
    
    // Calculate scroll: fullpage is ~4300px tall, browser content is ~920px, so we scroll 3380px
    tl.set("#browser-scroll", { height: "4300px", y: 0 }, 4);
    tl.to("#browser-scroll", { y: -2800, duration: 5, ease: "power1.inOut" }, 4.5);
    tl.to("#scene-2", { opacity: 0, duration: 0.4 }, 9.6);

    // Scene 3: Dish cards (10-16s)
    tl.to("#scene-3", { opacity: 1, duration: 0.3 }, 10);
    tl.fromTo("#scene-3-bg", { scale: 1.05 }, { scale: 1.0, duration: 6, ease: "power1.out" }, 10);
    tl.fromTo("#dish-1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 10.8);
    tl.fromTo("#dish-2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 11.3);
    tl.fromTo("#dish-3", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 11.8);
    tl.to("#scene-3", { opacity: 0, duration: 0.4 }, 15.6);

    // Scene 4: CTA (16-19s)
    tl.to("#scene-4", { opacity: 1, duration: 0.3 }, 16);
    tl.fromTo("#scene-4-bg", { scale: 1.08, x: 50 }, { scale: 1.0, x: 0, duration: 3, ease: "power1.out" }, 16);
    tl.fromTo("#cta", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 16.4);
    tl.to("#scene-4", { opacity: 0, duration: 0.4 }, 18.6);

    // Scene 5: Outro (19-22s)
    tl.to("#scene-5", { opacity: 1, duration: 0.3 }, 19);
    tl.fromTo("#scene-5-bg", { scale: 1.1 }, { scale: 1.0, duration: 3, ease: "power1.out" }, 19);
    tl.fromTo("#outro", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.1)" }, 19.4);
    tl.to("#scene-5", { opacity: 0, duration: 0.5 }, 21.5);

    window.__timelines = window.__timelines || {};
    window.__timelines["killa-brag"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
